# 最小 CI：把 README 里"739 个用例全绿 / analyze 干净"那句话变成**被验证过的**。
#
# 为什么是 windows-latest 而不是 ubuntu：
#   这个项目是 Flutter **Windows 桌面版**，`app/windows/` 的脚手架与平台服务
#   实现（DPAPI、文件选择、应用内提醒）只存在于 Windows 上。换 ubuntu 跑
#   等于换了一个项目在跑。
#
# 为什么 Flutter 版本用 `channel: stable` 而不是钉死：
#   本地实测是 3.47.4，但把版本号写进 CI 的风险是"写错就天天红"。
#   `pubspec.yaml` 声明了下限（flutter >=3.29.0），stable 满足它。
#   想要可复现的话，把 version 钉到与本地一致，并先手动跑一次确认。
#
# build-windows job（P0-12 新增）：
#   Dart 测试跑在 VM 上，**从不编译 `app/windows/` 的原生层** —— CMake 配置、
#   Runner.rc、C++ 代码改坏了，analyze + test 依旧全绿。对 Windows-only 项目
#   这是最大的验证盲区。原生编译慢（十几分钟），所以只在 push 到 main 与
#   手动触发时跑，PR 不跑（省额度）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支只保留最新一次，省额度也省等待
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `app/assets/data/` 被 .gitignore 排除（它是 `data/` 的消费副本），
      # 而 pubspec 声明了这个资源目录 —— 缺了它 `flutter test` 直接起不来。
      - name: 同步知识资产（data/ → app/assets/data/）
        run: python tools/data/sync_assets.py

      # 纯 Python 的本体结构自检：level 与 id 段数一致、父子完整、章节数 > 0。
      # 它拦的是"不报错但界面全空"的事故（章节曾变成 0）。
      - name: 本体结构自检
        run: python tools/data/knowledge_tree.py

      # 别名是生成物（alias_overrides.json → math*.json 的 aliases 字段）：
      # 人工改了 overrides 忘了重新生成时，这里要红而不是让召回悄悄退化。
      - name: 别名生成物自检
        run: python tools/data/gen_aliases.py --check

      # LaTeX 数据 lint：拦公式结构性错误（拦"知识点公式在渲染器里解析失败"）。
      - name: 公式数据自检
        run: python tools/data/check_formulas.py

      - name: 依赖
        working-directory: app
        run: flutter pub get

      - name: 静态检查
        working-directory: app
        run: flutter analyze

      - name: 测试
        working-directory: app
        run: flutter test

  build-windows:
    # 只在 main 提交与手动触发时编译原生层（PR 上跑太贵）。
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 同步知识资产（data/ → app/assets/data/）
        run: python tools/data/sync_assets.py

      - name: 依赖
        working-directory: app
        run: flutter pub get

      # 原生层从未被 Dart 测试覆盖：这一步红了 = windows/runner 的 C++/CMake
      # 或资源文件坏了 —— 正是 Dart 侧全绿也发现不了的故障。
      - name: 编译 Windows 原生层
        working-directory: app
        run: flutter build windows --release
