# Dart / Flutter 静态分析规则
#
# 目标：在**不牺牲开发速度**的前提下，挡住会导致跨平台返工的问题。
# 规则取舍原则：宁可少而严，不要多而松。

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # 生产代码里禁止的东西，提升为编译错误
    avoid_print: error
    missing_required_param: error
    missing_return: error
    todo: ignore

  exclude:
    - "**/*.g.dart"          # drift / json_serializable 生成产物
    - "**/*.freezed.dart"
    - "build/**"
    - windows/**

linter:
  rules:
    # ── 跨平台安全（本项目的核心纪律）────────────────────────────
    # 禁止直接 import dart:io —— 必须走 core/platform/capabilities.dart
    # 的条件导入，否则以后加 Web 版会编译失败。
    # 注：analyzer 无法对 import 做单文件级禁用，靠 code review + 此注释约束。

    # ── 正确性 ─────────────────────────────────────────────────
    always_declare_return_types: true
    avoid_empty_else: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    collection_methods_unrelated_type: true
    no_adjacent_strings_in_list: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true
    unrelated_type_equality_checks: true
    use_build_context_synchronously: true

    # ── 不可变性（避免 UI 状态被意外改写）──────────────────────
    prefer_final_locals: true
    prefer_final_in_for_each: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true

    # ── 可读性 ─────────────────────────────────────────────────
    directives_ordering: true
    sort_child_properties_last: true
    unnecessary_lambdas: true
    use_super_parameters: true
    # ⚠️ always_put_required_named_parameters_first 与 Flutter 惯例冲突：
    #    `const Foo({super.key, required this.x})` 要求 key 排在 required 参数
    #    之前，而该规则要求 required 在前。二者不可兼得，选择保留 Flutter 惯例。
    always_put_required_named_parameters_first: false

    # ── 性能（错题本列表 5000 题不掉帧的保障）──────────────────
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true
    use_colored_box: true
    use_decorated_box: true

    # ── 明确关闭 ───────────────────────────────────────────────
    # public_member_api_docs: 不强制，domain 层关键类已手写文档
    # lines_longer_than_80_chars: 关闭，中文注释与 LaTeX 字符串会超长
    public_member_api_docs: false
    lines_longer_than_80_chars: false
