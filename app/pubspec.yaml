name: kaoyan_math_agent
description: 考试知识库 Agent（exam-kb-agent）：本地优先的错题与知识库整理工具，BYOK、Markdown 为事实源（Windows 版 V1，现支持考研数学一/二/三）
publish_to: "none"
version: 0.1.0+1

environment:
  # ## 下限是**推导**出来的，不是实测的
  #
  # 之前写的是 `flutter: ">=3.24.0"`，那是**错的** —— 代码里用了
  # Flutter 3.27 才有的 API，用 3.24 编译会直接失败，而约束却放它通过。
  # 声明一个比实际需要更低的下限，比不声明更糟：它让人以为能编译。
  #
  # 推导依据（代码里实际用到的、最新的 API）：
  #   `Color.withValues()` / `Color.toARGB32()`   → Flutter 3.27
  #       （`colors` 的宽色域改造，替代已废弃的 `Color.value`）
  #   `ThemeData.cardTheme: CardThemeData(...)`   → Flutter 3.29
  #       （`CardTheme` 这个数据类被 `CardThemeData` 取代）
  #
  # ⚠️ 我们**没有**在 3.29 上实测过。本项目实际构建与测试用的是
  # Flutter 3.47.4 / Dart 3.13.3（见 `docs/SETUP.md`）。
  # 这个下限的作用是"拦住明显太旧的 SDK"，不是"承诺 3.29 一定能构建"。
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # ── 状态管理 ────────────────────────────────────────────────────
  # ⚠️ 刻意**不**依赖 `go_router`（原为 ^14.2.0）。
  #
  # 它是 V1_PLAN 的技术栈里列的，但实测导航根本没用它：外壳是
  # `AdaptiveShell` 里的 `IndexedStack` + 索引下标，页面之间只有
  # `Navigator.push` 一种跳转（错题本 → 编辑录入页）。
  # 声明了却零引用，只会拖长构建时间、并让人以为存在一套没在用的路由约定。
  #
  # 将来真需要深链接（比如"从通知点进来直接开复习页"）时再加回来 ——
  # 那时 `AdaptiveShell` 要改成路由驱动，是一件事而不是两件。
  flutter_riverpod: ^2.5.1
  # ── 数据层：SQLite + FTS5 全文检索 ──────────────────────────────
  drift: ^2.20.0
  path_provider: ^2.1.4
  path: ^1.9.0
  #
  # ⚠️ 刻意**不**依赖 `sqlite3_flutter_libs`（原为 ^0.5.24）。
  #
  # 它和 `sqlite3`（drift 的传递依赖）会提供**同一份原生库**，是两套重复机制：
  #   - `sqlite3` 走 Dart Native Assets：直接取预编译好的 sqlite3.dll
  #   - `sqlite3_flutter_libs` 走 CMake：构建时下载 sqlite 源码再现场编译
  #
  # 后者在构建时从这里下载源码包：
  #     https://sqlite.org/2026/sqlite-autoconf-3520000.tar.gz
  # 实测国内网络拿不到 —— 文件下成 **0 字节**，CMake 的 download 步骤
  # 反复重试、构建无限期挂住（不是报错退出，是卡死）。
  #
  # 而 Native Assets 那条路已经打通：`tools/vendor/sqlite3.x64.windows.dll`
  # 是之前绕开 GitHub 封锁预置的（见 tools/setup_windows.py），
  # `data_layer_test.dart` 的 32 个用例跑的就是真实 sqlite3。
  #
  # 保留两套还有个隐患：同一份库被链接两次，容易出现重复符号或版本不一致。
  #
  # 若将来发现 Native Assets 不足以覆盖某场景，回退办法是预置源码包：
  # 用镜像下载 sqlite-autoconf-<ver>.tar.gz，放进
  # `build/windows/x64/_deps/sqlite3-subbuild/sqlite3-populate-prefix/src/`，
  # 并写上传入 stamp，避免 CMake 重新下载。

  # ── 安全存储（Windows 走 DPAPI，用于存用户自带的 LLM API Key）──
  flutter_secure_storage: ^9.2.2

  # ── 网络：直连用户自己的 LLM API ────────────────────────────────
  dio: ^5.7.0

  # ── 数据格式 ────────────────────────────────────────────────────
  yaml: ^3.1.2          # 解析题目 Markdown 的 frontmatter
  crypto: ^3.0.5        # 题目去重指纹
  #
  # ⚠️ 这里曾经声明过 `collection` / `uuid` / `intl` —— 三个都**零引用**。
  #
  # 与本文件里其它"声明了却零引用"的依赖（go_router / share_plus /
  # printing / sqlite3_flutter_libs）同一个毛病：它们会拖长构建时间、
  # 进构建产物，还会让人以为存在一套没在用的约定。
  #
  # `collection` 的能力（`firstWhereOrNull` 等）Dart 3 的扩展方法已经覆盖；
  # `uuid` 没用上是因为题目 id 走的是"人类可读 + 指纹"那套；
  # `intl` 没用上是因为日期文案都是手写的（`${ts.month}月${ts.day}日`），
  # 只有三个数字要补零，不值得为它引一个本地化包。
  # 将来真要用（比如按语言格式化日期）再加回来。

  # ── 导出 ────────────────────────────────────────────────────────
  #
  # `pdf` 是**纯 Dart**，负责生成 PDF 字节流 —— M6 组卷导出靠它，留着。
  #
  # ⚠️ `printing` 暂时移除（原为 `printing: ^5.13.2`）。它是原生插件，
  # 构建时会从 GitHub Releases 下载 pdfium 二进制：
  #     https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/<ver>/pdfium-win-x64.tgz
  # 国内网络下这一步必然失败：
  #     CMake Error at .../printing/windows/DownloadProject.cmake:179
  #       Build step for pdfium failed: 1
  # 而它当前**没有任何代码在用**（只在 dev_shell 的占位文案里出现过），
  # 所以不该为了它让整个工程构建不了。
  #
  # M6 做 PDF 预览/打印时再引回来，届时的解法是预置 pdfium：
  # 用 ghproxy.net 镜像下载后放进插件的 `pdfium-download` 目录
  # （与 sqlite3 原生库同一套办法，见 tools/setup_windows.py）。
  pdf: ^3.11.1

  # ── 桌面系统集成 ────────────────────────────────────────────────
  file_selector: ^1.0.3
  window_manager: ^0.4.2
  # ⚠️ 刻意**不**依赖 `share_plus`（原为 ^10.0.2）。
  #
  # V1_PLAN 把它列为"导出分享"，但桌面端根本没有"分享到"这个动作 ——
  # Windows 上用户要的是"导出到某个文件夹"，那是 `file_selector` 的
  # `getDirectoryPath()`（已在 `ImageSourceService` 里实现）。声明了却零引用，
  # 白白多一个插件 DLL 和一条 `url_launcher` 传递依赖链。
  #
  # 移动端（V2）确实需要系统分享面板，到那时再加回来。
  #
  # ⚠️ 已移除 flutter_local_notifications。
  #    17.x 版本**不支持 Windows**（编译期报 No named parameter 'windows'），
  #    而即使升级到支持的版本，未 MSIX 打包时 cancel() 也无效、
  #    且不支持重复通知。
  #    提醒改由应用内调度实现（core/platform/notify_service_windows.dart
  #    里的 ReminderScheduler），跨平台且不依赖原生能力。
  #    将来要加系统 Toast 时，只需替换 NotifyService 的实现，调用方不用改。

  # ── 图表：掌握度画像 ────────────────────────────────────────────
  fl_chart: ^0.69.0

  # ⚠️ 这里曾经声明过 `image` —— **零引用**。
  #
  # 批量导入不做本地图像处理：图片原样交给云端视觉模型（见
  # `services/ingest/`）。所以当时"顺手加上去"的这个包一次都没用上。
  # 将来真要在本机压缩/裁剪（比如为了省 token 先缩图）再加回来。

  # ── 公式渲染 ───────────────────────────────────────────────────
  # `katex` 是 KaTeX 的 Flutter 封装：底层 `katex_dart`（纯 Dart 解析器）
  # 把 LaTeX 编成箱树，`KatexBoxPainter extends CustomPainter` 直接画 Canvas。
  # **不用 WebView，也不产 SVG** —— SVG 那条路每条公式 460 KiB（99.8% 是内嵌
  # 字体），在列表里滚动不可接受。
  #
  # 实测（2026-03-16，katex_dart 0.1.1 + katex 1.0.0）：
  #   - 解析 1609 条真实公式 314ms（0.196 ms/式）；走 CustomPainter 的画法
  #     只需 `renderToBox` 的 0.245 ms/式
  #   - 18 条解析失败，其中真实知识点公式只占 2 条：一条是**数据录入错误**
  #     （`\text{` 少了收尾花括号，已在 data/ 里修掉，并加了
  #      `tools/data/check_formulas.py` 守住），另一条是 `\iddots` 不支持
  #   - CJK 走 Flutter 的 `TextPainter`，回退行为由 `test/katex_render_test.dart`
  #     盯住
  #
  # 业务代码只依赖 lib/core/math/math_renderer.dart 的 MathRenderer 抽象，
  # 换底层包不影响任何调用方（MathRenderer 的存在就是为了这个）。
  katex: ^1.0.0

  # `katex_dart` 是 `katex` 的传递依赖，但**我们直接用了它的 API**
  # （`renderToBox` / `boxSizePx` / `boxSizePxPadded` / `KatexOptions`），
  # 用来把公式渲成 PNG 嵌进 PDF（见 services/paper/formula_rasterizer.dart）。
  #
  # 所以必须显式声明：靠传递依赖拿 API，会在上游换实现或改依赖树时
  # 突然编译不过，而那时你根本不知道是自己用了个没声明的包。
  katex_dart: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

  # ⚠️ 这里曾经是 `archive: any` —— 两个问题：
  #
  # 1. **无界约束**。`any` 意味着任何一个版本都接受，包括将来会破坏
  #    兼容的大版本。它只在 `paper_export_test.dart` 里用来解压 PDF
  #    内容流（`ZLibDecoder`），而 `dart:io` 自带 zlib 编解码
  #    （`zlib.decode`）—— 为一个测试函数引一个包本来就不划算。
  # 2. 所以这个依赖**已经删掉了**，不是改成了有界约束。
  #    现在那个测试用 `dart:io` 的 `zlib`。
flutter:
  uses-material-design: true

  # 知识资产（知识点本体、错因词表、考频数据、组卷模板）。
  #
  # ⚠️ 这些是**构建产物**，事实源在仓库根的 `data/` 目录。
  #    因为 Flutter 不允许 assets 引用应用目录之外的路径，
  #    所以采用「单一事实源 + 构建前同步」。
  #
  #    修改 data/ 之后必须执行：
  #        python tools/data/sync_assets.py
  #    再 `flutter run`，否则 App 读到的还是旧数据。
  #
  #    同步逻辑见 tools/data/sync_assets.py。
  assets:
    - assets/data/knowledge_points/
    - assets/data/error_causes.json
    - assets/data/exam_frequency.json
    - assets/data/exam_templates.json

  # 中文字体：Windows 自带微软雅黑，无需打包。
  # 数学公式渲染所需的字体由具体渲染包提供。
